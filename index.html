<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para mi Niña Hermosa ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --lila: #7e57c2; --rosa: #f48fb1; --lila-claro: #f3e5f5; --texto: #4a3475; }
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        
        body { 
            height: 100vh; width: 100vw; background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%); 
            font-family: 'Quicksand', sans-serif; display: flex; justify-content: center; align-items: center; 
            overflow: hidden; color: var(--texto); position: relative;
        }

        /* Lluvia de emojis de fondo */
        #emoji-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; opacity: 0.5; }
        .emoji-drop { position: absolute; font-size: 1.5rem; animation: fall linear infinite; }
        @keyframes fall { from { transform: translateY(-10vh); } to { transform: translateY(110vh); } }

        .app-container { 
            width: 95%; max-width: 420px; height: 92vh; background: rgba(255, 255, 255, 0.95); 
            border-radius: 40px; padding: 25px; display: flex; flex-direction: column;
            box-shadow: 0 25px 60px rgba(126, 87, 194, 0.2); z-index: 10; border: 4px solid white; backdrop-filter: blur(10px);
        }

        .screen { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.4s ease; overflow-y: auto; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        h1 { font-family: 'Dancing Script', cursive; color: var(--lila); font-size: 2.3rem; text-align: center; margin-bottom: 15px; }
        p { line-height: 1.6; font-weight: 500; font-size: 0.95rem; margin-bottom: 15px; }

        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 2px solid var(--lila-claro); text-align: center; outline: none; font-size: 1rem; }
        .main-btn { background: var(--lila); color: white; border: none; padding: 18px; border-radius: 30px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }

        .img-fase { width: 100%; height: 160px; object-fit: cover; border-radius: 20px; margin-bottom: 15px; border: 3px solid white; }
        
        /* Botones de la declaración */
        .area-peticion { width: 100%; min-height: 200px; position: relative; display: flex; justify-content: center; align-items: center; }
        #btnSi { background: #66bb6a; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-weight: 700; z-index: 10; transition: 0.2s; cursor: pointer; }
        #btnNo { background: #ef5350; color: white; border: none; padding: 12px 25px; border-radius: 50px; font-weight: 700; position: absolute; z-index: 100; cursor: pointer; transition: 0.1s; right: 20px; }

        .gif-final { width: 100%; max-width: 250px; border-radius: 20px; margin: 20px auto; display: block; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div id="emoji-bg"></div>

    <div class="app-container">
        <section id="p-login" class="screen active" style="justify-content: center;">
            <div style="font-size: 60px; text-align: center; margin-bottom: 10px;">🔓</div>
            <h1>Hola mi niña... 💗</h1>
            <p style="text-align: center;">Introduce los datos para entrar:</p>
            <input type="text" id="userInput" placeholder="Tu nombre (Eve)">
            <input type="text" id="passInput" placeholder="Nuestra fecha (17/09/24)">
            <button class="main-btn" onclick="validarYEntrar()">Entrar ➔</button>
            <p id="error" style="color: red; font-size: 0.8rem; display: none; margin-top: 10px; text-align: center;">Datos incorrectos, mi amor... ❤️</p>
        </section>

        <section id="fase1" class="screen">
            <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=500" class="img-fase">
            <h1>Donde todo inició... ⏳</h1>
            <div id="text1" style="min-height: 120px;"></div>
            <button id="btn1" class="main-btn" onclick="irAFase(2)" style="display:none;">Continuar ➔</button>
        </section>

        <section id="fase2" class="screen">
            <img src="https://images.unsplash.com/photo-1516589174184-c68526572af0?q=80&w=500" class="img-fase">
            <h1>Mi lugar seguro 🫂</h1>
            <div id="text2" style="min-height: 120px;"></div>
            <button id="btn2" class="main-btn" onclick="irAFase(3)" style="display:none;">Sigue leyendo... ➔</button>
        </section>

        <section id="fase3" class="screen">
            <img src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?q=80&w=500" class="img-fase">
            <h1>¿Me harías el honor? 💍</h1>
            <div id="text3" style="min-height: 100px;"></div>
            <div class="area-peticion" id="areaBotones" style="display:none;">
                <button id="btnSi" onclick="finalizar()">¡SÍ, ACEPTO! 💖</button>
                <button id="btnNo" onmouseover="escapar()" onclick="escapar()">NO ❌</button>
            </div>
        </section>

        <section id="p-final" class="screen" style="justify-content: center; align-items: center;">
            <h1>¡Gracias por decir que sí! 😍</h1>
            <p style="text-align: center;">Me haces el hombre más afortunado del mundo. Prometo cuidarte y amarte siempre. ❤️✨</p>
            
            <img src="https://tenor.com/view/kiss-gif-kiss-gif-couple-cat-kiss-cat-cat-love-gif-8652318762219175687.gif" class="gif-final">
            
            <div style="font-size: 3rem;">👩‍❤️‍👨💍♾️</div>
        </section>
    </div>

    <script>
        let escala = 1;
        const frases = {
            t1: "Desde aquel 17 de septiembre, mi vida tomó un color diferente. No fue casualidad empezar a ser tan cercanos; fue el destino dándome la oportunidad de conocerte. ✨🌸",
            t2: "Lo que hemos compartido me ha confirmado que nuestra confianza es algo único. Quiero ser tu hogar y tu refugio siempre. 🫂💜",
            t3: "Evelyn, por todo lo que somos y lo que seremos... ¿Quieres ser mi novia? 💖💍"
        };

        function irAPantalla(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function validarYEntrar() {
            const u = document.getElementById('userInput').value;
            const p = document.getElementById('passInput').value;
            if(u.toLowerCase().includes("eve") && p === "17/09/24") {
                irAFase(1);
                crearLluvia();
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }

        function escribir(texto, elemento, botonId) {
            let i = 0;
            const el = document.getElementById(elemento);
            el.innerHTML = "";
            const t = setInterval(() => {
                if(i < texto.length) { el.innerHTML += texto.charAt(i); i++; }
                else { 
                    clearInterval(t); 
                    document.getElementById(botonId).style.display = botonId === 'areaBotones' ? 'flex' : 'block';
                }
            }, 50);
        }

        function irAFase(n) {
            irAPantalla('fase' + n);
            escribir(frases['t' + n], 'text' + n, n === 3 ? 'areaBotones' : 'btn' + n);
        }

        function escapar() {
            const b = document.getElementById('btnNo');
            const a = document.getElementById('areaBotones');
            b.style.left = Math.random() * (a.clientWidth - 80) + 'px';
            b.style.top = Math.random() * (a.clientHeight - 40) + 'px';
            escala += 0.2;
            document.getElementById('btnSi').style.transform = `scale(${escala})`;
        }

        function finalizar() {
            irAPantalla('p-final');
        }

        function crearLluvia() {
            const bg = document.getElementById('emoji-bg');
            for (let i = 0; i < 15; i++) {
                let e = document.createElement('div');
                e.className = 'emoji-drop';
                e.innerText = ['🌸', '💖', '✨', '🐱'][Math.floor(Math.random()*4)];
                e.style.left = Math.random() * 100 + 'vw';
                e.style.animationDuration = (Math.random() * 3 + 2) + 's';
                bg.appendChild(e);
            }
        }
    </script>
</body>
</html>
