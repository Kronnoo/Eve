<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para Evelyn</title>
    <style>
        body { 
            background: #fff0f5; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            max-width: 500px; 
            text-align: center; 
        }
        h1 { color: #d81b60; font-family: 'Dancing Script', cursive; min-height: 1.5em; }
        #typewriter { 
            color: #555; 
            line-height: 1.6; 
            font-size: 1.1rem; 
            margin-bottom: 20px;
            min-height: 120px; /* Evita que el contenido salte al escribir */
        }
        .photo-container {
            margin: 20px 0;
            border-radius: 15px;
            overflow: hidden;
            border: 5px solid #fce4ec;
        }
        .photo-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .love-text {
            color: #e91e63;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
            display: inline-block;
            animation: heartbeat 1.2s infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }
        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #d81b60;
            margin-left: 2px;
            animation: blink 0.7s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <h1>Evelyn...</h1>
        
        <div id="typewriter"></div>
        
        <div class="photo-container">
            <!-- Asegúrate de que el nombre del archivo sea exacto -->
            <img src="Mi amor.png" alt="Nosotros">
        </div>

        <div class="love-text">Te amo mi amor 💗💗</div>
    </div>

    <script>
        const textElement = document.getElementById('typewriter');
        const message = "Me quedé pensando en lo que me dijiste hoy. Quiero que sepas que te escuché fuerte y claro. No te lo dije en ese momento porque quiero que cuando lo haga sea especial, como tú te mereces. Quiero que sepas que mi meta es clara: Eres tú y nadie más. ♾️🐾";
        
        let index = 0;

        function type() {
            if (index < message.length) {
                textElement.innerHTML = message.slice(0, index + 1) + '<span class="cursor">|</span>';
                index++;
                setTimeout(type, 50); // Velocidad de escritura
            } else {
                // Al terminar, quitamos el cursor o lo dejamos estático
                textElement.innerHTML = message;
            }
        }

        // Iniciar el efecto cuando cargue la página
        window.onload = type;
    </script>
</body>
</html>
